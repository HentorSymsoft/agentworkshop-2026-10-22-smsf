<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Example tile</title>
<style>
  /* min-height, not height:100% with overflow:hidden: /colony measures scrollHeight so the tile can
     grow with its content, and a locked body only reports the tile's own height. */
  html,body{margin:0;min-height:320px;background:#070b16;color:#e9eef7;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;text-align:center}
  h1{color:#ffb454;font-size:18px;margin:0 0 6px;letter-spacing:.14em;text-transform:uppercase}
  p{margin:0;color:#8a98b3}
  .n{font-size:52px;font-weight:700;color:#5fd7a7;margin:8px 0;text-shadow:0 0 24px #5fd7a755}
</style></head>
<body><div><h1>Example tile</h1><div class="n" id="n">·</div><p>posts on the board so far</p></div>
<script>
// The example team's tile in /colony. It reads from its own backend in board/plugins/exempelkvarteret/;
// your tile can do the same on /t/<your-team-name>/... — same origin, no CORS.
const visa = () => fetch('/t/exempelkvarteret/status').then(r => r.json())
  .then(s => { const n = s.posts ?? s.messages ?? s['inlägg']; if (n !== undefined) document.getElementById('n').textContent = n; })
  .catch(() => {});
visa(); setInterval(visa, 10000);
</script></body></html>
